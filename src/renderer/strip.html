<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<title>Tokkie strip</title>
<style>
  :root {
    --bg: oklch(0.215 0.012 265 / 0.96); --raised: oklch(0.29 0.014 265); --line: oklch(1 0 0 / 0.14);
    --ink: oklch(0.965 0.005 265); --ink-2: oklch(0.78 0.012 265); --ink-3: oklch(0.66 0.012 265);
    --accent: oklch(0.78 0.12 175); --good: oklch(0.78 0.14 160); --warn: oklch(0.83 0.14 82); --bad: oklch(0.72 0.18 25);
    --shadow: 0 6px 22px oklch(0 0 0 / 0.35);
  }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
    --bg: oklch(0.99 0.003 265 / 0.97); --raised: oklch(0.94 0.006 265); --line: oklch(0.2 0.02 265 / 0.16);
    --ink: oklch(0.22 0.015 265); --ink-2: oklch(0.38 0.016 265); --ink-3: oklch(0.5 0.016 265);
    --accent: oklch(0.48 0.12 175); --good: oklch(0.48 0.12 160); --warn: oklch(0.50 0.13 68); --bad: oklch(0.54 0.2 25);
    --shadow: 0 6px 22px oklch(0.2 0.02 265 / 0.18);
  } }
  :root[data-theme="light"] {
    --bg: oklch(0.99 0.003 265 / 0.97); --raised: oklch(0.94 0.006 265); --line: oklch(0.2 0.02 265 / 0.16);
    --ink: oklch(0.22 0.015 265); --ink-2: oklch(0.38 0.016 265); --ink-3: oklch(0.5 0.016 265);
    --accent: oklch(0.48 0.12 175); --good: oklch(0.48 0.12 160); --warn: oklch(0.50 0.13 68); --bad: oklch(0.54 0.2 25);
    --shadow: 0 6px 22px oklch(0.2 0.02 265 / 0.18);
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none;
    font: 500 12px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  .bar { position: fixed; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 2px; height: 30px; padding: 0 4px 0 2px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); cursor: grab; white-space: nowrap; }
  .bar.dragging { cursor: grabbing; }
  .grip { width: 10px; height: 16px; margin: 0 2px 0 4px; opacity: .45; background-image: radial-gradient(currentColor 1.1px, transparent 1.3px); background-size: 4px 4px; color: var(--ink-2); }
  .it { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 7px; border-radius: 7px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .it:hover, .it.on { background: var(--raised); color: var(--ink); }
  .it svg, button svg { width: 13px; height: 13px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
  .it[data-k="good"] .v { color: var(--good); } .it[data-k="warn"] .v { color: var(--warn); } .it[data-k="bad"] .v { color: var(--bad); }
  .it[data-k="bad"] svg { color: var(--bad); opacity: 1; }
  .sep { width: 1px; height: 16px; background: var(--line); margin: 0 3px; }
  button { all: unset; display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 7px; cursor: pointer; color: var(--ink); font-weight: 600; }
  button:hover { background: var(--raised); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.opt svg { color: var(--accent); opacity: 1; }
  button.ico { padding: 0 6px; color: var(--ink-2); }
  .tip { position: fixed; left: 8px; bottom: 46px; max-width: calc(100vw - 20px); box-sizing: border-box; padding: 7px 10px; border-radius: 9px;
    background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--ink-2); font-size: 12px; line-height: 1.4; white-space: normal; }
  .tip b { color: var(--ink); font-weight: 650; }
  .tip[data-kind="warn"] b { color: var(--warn); } .tip[data-kind="ok"] b { color: var(--good); }
  .tip.click { cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="tip" id="tip" role="status" aria-live="polite" hidden></div>
<div class="bar" id="bar" role="toolbar" aria-label="Tokkie strip: drag to move"></div>
<script type="module" src="strip.js"></script>
</body>
</html>
